<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243d51"><title>CONAHP 2026 - Agenda</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head><body><main><header><p class="eyebrow">14 e 15 de outubro · São Paulo</p><h1>CONAHP 2026</h1><p>Agenda personalizada</p><p id="identity" role="status">Verificando acesso…</p><button id="loginButton" type="button" hidden>Entrar para salvar preferências</button></header><section class="toolbar" aria-label="Filtros"><label>Busca<input id="search" type="search" placeholder="Sessão, participante, instituição"></label><label>Dia<select id="day"><option value="">Ambos</option><option value="2026-10-14">14/10</option><option value="2026-10-15">15/10</option></select></label><label>Trilha<select id="track"><option value="">Todas</option></select></label><label>Prioridade<select id="priorityFilter"><option value="">Todas</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Essencial</option></select></label><label>Das<input id="timeFrom" type="time" aria-label="Horário inicial"></label><label>Até<input id="timeTo" type="time" aria-label="Horário final"></label><label>Visualização<select id="view"><option value="list">Lista</option><option value="grid">Grade horária</option></select></label><label class="check"><input id="attendingOnly" type="checkbox"> Só pretendo assistir</label></section><p id="sourceNote" class="note"></p><p id="notice" role="alert"></p><p id="summary" role="status"></p><section id="sessions" aria-label="Sessões da programação"></section></main><script type="module" src="/app.js"></script></body></html>
